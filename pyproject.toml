[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frameflow"
version = "0.1.0"
description = "Local, observable multicamera synchronization and review"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "playwright>=1.49,<2"]

[project.scripts]
frameflow = "frameflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
frameflow = ["static/*"]
