name: Frameflow checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frameflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install application and tests
        run: python -m pip install -e ".[test]"
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: command -v ffmpeg >/dev/null || brew install ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Check media tools
        run: python -c "import shutil; assert shutil.which('ffmpeg') and shutil.which('ffprobe')"
      - name: Unit and contract checks
        run: python -m unittest discover -s tests -v
      - name: Check browser script syntax
        run: node --check src/frameflow/static/app.js

  synthetic-workflow:
    name: Synthetic media / actual Align / browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          python -m pip install -e ".[test]"
          sudo apt-get update && sudo apt-get install -y ffmpeg zstd
          python -m playwright install --with-deps chromium
      - name: Fetch and verify pinned external Align CLI
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/frameflow-align"
          curl --fail --location --retry 2 --max-time 120 \
            https://github.com/FedyaLight/align/releases/download/v0.3.3/align-0.3.3-1-x86_64.pkg.tar.zst \
            --output "$RUNNER_TEMP/frameflow-align/package.tar.zst"
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'frameflow-align/package.tar.zst'
          assert hashlib.sha256(path.read_bytes()).hexdigest() == '3098b7c3d98db1058c1131a13ccdaa1f208c20f4b9504d8a70c647e332a7f307'
          PY
          tar --zstd -xf "$RUNNER_TEMP/frameflow-align/package.tar.zst" \
            -C "$RUNNER_TEMP/frameflow-align" opt/align/align-cli
          printf 'FRAMEFLOW_TEST_ALIGN=%s\n' "$RUNNER_TEMP/frameflow-align/opt/align/align-cli" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/frameflow-align/opt/align/align-cli" --version
      - name: Real engine and end-to-end synthetic media checks
        run: python -m unittest discover -s tests -v
      - name: Real browser workflow
        run: python tools/browser_smoke.py --artifacts "$RUNNER_TEMP/frameflow-browser"
      - name: Upload synthetic verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-browser-evidence
          path: ${{ runner.temp }}/frameflow-browser
          if-no-files-found: warn
          retention-days: 7
